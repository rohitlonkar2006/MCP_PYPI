[project]
name = "free-agentic-terminal"
version = "0.1.0"
description = "An MCP Which adds the terminal capabilities to an agent."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.3",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
agentic_terminal = "agentic_terminal.main:main" 

